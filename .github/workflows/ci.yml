name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

env:
  DATABASE_URL: mysql://pixelpay:pixelpay@localhost:3306/pixelpay_test
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: test_jwt_secret_64_chars_minimum_for_testing_purposes_only
  JWT_REFRESH_SECRET: test_refresh_secret_64_chars_minimum_for_testing_purposes
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  JWT_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-dotnet

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: pixelpay
          MYSQL_USER: pixelpay
          MYSQL_PASSWORD: pixelpay
          MYSQL_DATABASE: pixelpay_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u pixelpay -ppixelpay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release

      # Unit tests, and integration tests against Testcontainers MySQL/Redis.
      - name: Test
        run: dotnet test -c Release --no-build

      - name: Migrate and seed the e2e database
        run: |
          dotnet run -c Release --no-build --no-launch-profile --project src/PixelPay.Api -- migrate
          dotnet run -c Release --no-build --no-launch-profile --project src/PixelPay.Api -- seed

      - name: Start API (port 3000) and worker
        run: |
          APP_PORT=3000 nohup dotnet run -c Release --no-build --no-launch-profile --project src/PixelPay.Api > api.log 2>&1 &
          nohup dotnet run -c Release --no-build --no-launch-profile --project src/PixelPay.Worker > worker.log 2>&1 &
          timeout 120 bash -c "until curl -sf http://localhost:3000/api/v1/health; do sleep 2; done"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # package-lock.json is gitignored, so there is nothing for npm ci or the npm cache to use.
      - name: Install e2e dependencies
        working-directory: .
        run: npm install --workspace=@pixelpay/e2e

      - name: Run e2e suites
        working-directory: apps/e2e
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Server logs
        if: failure()
        run: cat api.log worker.log || true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --workspace=@pixelpay/web

      - name: Build Web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://pixelpay.th/api/v1
          NEXT_PUBLIC_WS_URL: https://pixelpay.th
        run: npm run build
