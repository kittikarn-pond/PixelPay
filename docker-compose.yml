services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: pixelpay
      MYSQL_USER: pixelpay
      MYSQL_PASSWORD: pixelpay
      MYSQL_DATABASE: pixelpay
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pixelpay", "-ppixelpay"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass pixelpay
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "pixelpay", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api.dev
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules
    ports:
      - "4010:3010"
    env_file: .env
    environment:
      APP_PORT: 3010
      DATABASE_URL: mysql://pixelpay:pixelpay@mysql:3306/pixelpay
      REDIS_URL: redis://:pixelpay@redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-dotnet:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api-dotnet.dev
    volumes:
      - ./apps/api-dotnet:/app
      - /app/src/PixelPay.Domain/bin
      - /app/src/PixelPay.Domain/obj
      - /app/src/PixelPay.Application/bin
      - /app/src/PixelPay.Application/obj
      - /app/src/PixelPay.Infrastructure/bin
      - /app/src/PixelPay.Infrastructure/obj
      - /app/src/PixelPay.Api/bin
      - /app/src/PixelPay.Api/obj
    ports:
      - "4002:3000"
    env_file: .env
    environment:
      APP_PORT: 3000
      DATABASE_URL: mysql://pixelpay:pixelpay@mysql:3306/pixelpay
      REDIS_URL: redis://:pixelpay@redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.gateway.dev
    volumes:
      - ./apps/api-dotnet:/app
      - /app/src/PixelPay.Gateway/bin
      - /app/src/PixelPay.Gateway/obj
    ports:
      - "4000:8080"
    environment:
      NODE_API_URL: http://api:3010
      NET_API_URL: http://api-dotnet:3000
    depends_on:
      - api
      - api-dotnet

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web.dev
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
    ports:
      - "4001:3001"
    env_file: .env
    environment:
      API_URL_INTERNAL: http://gateway:8080/api/v1
    depends_on:
      - gateway

volumes:
  mysql_data:
  redis_data:
