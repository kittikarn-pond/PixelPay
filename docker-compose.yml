x-dotnet-dev: &dotnet-dev
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile.api.dev
  env_file: .env
  environment: &dotnet-env
    DATABASE_URL: mysql://pixelpay:pixelpay@mysql:3306/pixelpay
    REDIS_URL: redis://:pixelpay@redis:6379
  volumes:
    - ./apps/api-dotnet:/app
    - /app/src/PixelPay.Domain/bin
    - /app/src/PixelPay.Domain/obj
    - /app/src/PixelPay.Application/bin
    - /app/src/PixelPay.Application/obj
    - /app/src/PixelPay.Infrastructure/bin
    - /app/src/PixelPay.Infrastructure/obj
    - /app/src/PixelPay.Api/bin
    - /app/src/PixelPay.Api/obj
    - /app/src/PixelPay.Worker/bin
    - /app/src/PixelPay.Worker/obj

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: pixelpay
      MYSQL_USER: pixelpay
      MYSQL_PASSWORD: pixelpay
      MYSQL_DATABASE: pixelpay
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pixelpay", "-ppixelpay"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass pixelpay
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "pixelpay", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applies EF Core migrations, then exits. A database Prisma created is baselined, not recreated.
  migrate:
    <<: *dotnet-dev
    command: ["dotnet", "run", "--project", "src/PixelPay.Api", "--", "migrate"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  api:
    <<: *dotnet-dev
    ports:
      - "4000:3000"
    environment:
      <<: *dotnet-env
      APP_PORT: 3000
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *dotnet-dev
    command: ["dotnet", "watch", "--project", "src/PixelPay.Worker", "run"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web.dev
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
    ports:
      - "4001:3001"
    env_file: .env
    environment:
      API_URL_INTERNAL: http://api:3000/api/v1
      # File events from a Windows/macOS host do not reach the container; poll so edits hot-reload.
      WATCHPACK_POLLING: "true"
    depends_on:
      - api

volumes:
  mysql_data:
  redis_data:
